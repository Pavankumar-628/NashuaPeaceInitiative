<div class="container">
  <div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>Community Feedback</h2>
    <p style="margin-bottom: 1rem; color: #64748b;">Share comments or educational questions regarding this simulation.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" formControlName="name" class="form-control" />
      </div>

      <div class="form-group">
        <label>Email *</label>
        <input type="email" formControlName="email" class="form-control" />
      </div>

      <div class="form-group">
        <label>Message *</label>
        <textarea rows="4" formControlName="message" class="form-control"></textarea>
      </div>

      <button type="submit" [disabled]="form.invalid" class="btn">Submit Feedback</button>

      <div *ngIf="statusMessage" class="alert alert-success">
        {{ statusMessage }}
      </div>
    </form>
  </div>
</div>
